<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-labelledby="title desc">
  <title id="title">PointNet-TMax and MPH-Gait model architectures</title>
  <desc id="desc">A publication-ready comparison of the PointNet-TMax baseline and the proposed MPH-Gait multi-scale point hierarchy network.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #475569; }
      .panelTitle { font: 700 27px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .panelMeta { font: 600 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .blockTitle { font: 700 20px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .blockText { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; text-anchor: middle; }
      .tiny { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
      .note { font: 600 17px Arial, Helvetica, sans-serif; fill: #7c2d12; }
      .formula { font: italic 600 19px Georgia, serif; fill: #065f46; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 7; }
      .box { stroke-width: 2; rx: 7; }
      .input { fill: #f8fafc; stroke: #64748b; }
      .shared { fill: #ecfeff; stroke: #0f766e; }
      .global { fill: #eff6ff; stroke: #2563eb; }
      .hier { fill: #fff7ed; stroke: #c2410c; }
      .fusion { fill: #ecfdf5; stroke: #047857; }
      .output { fill: #f0fdf4; stroke: #15803d; }
      .train { fill: #faf5ff; stroke: #7e22ce; stroke-dasharray: 7 5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .arrowOrange { fill: none; stroke: #c2410c; stroke-width: 3; marker-end: url(#arrowOrange); }
      .arrowGreen { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#arrowGreen); }
      .routing { fill: none; stroke: #c2410c; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowOrange); }
      .branchDot { fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="1060" fill="#f8fafc"/>
  <text x="60" y="48" class="title">PointNet-TMax Baseline and the Proposed MPH-Gait</text>
  <text x="60" y="78" class="subtitle">Raw metric XYZ input · shared PointNet stem · gallery retrieval with a normalized 256-D descriptor</text>

  <!-- Panel A: baseline -->
  <rect x="40" y="102" width="1720" height="292" class="panel"/>
  <text x="68" y="139" class="panelTitle">(a) PointNet with Temporal Max Pooling (PointNet-TMax)</text>
  <text x="1728" y="139" class="panelMeta" text-anchor="end">313,664 parameters</text>

  <rect x="70" y="181" width="174" height="91" class="box input"/>
  <text x="157" y="213" class="blockTitle">Point sequence</text>
  <text x="157" y="241" class="blockText">B × T × N × 3</text>
  <text x="157" y="263" class="tiny">T=15, N=1024</text>
  <g fill="#64748b" opacity="0.8">
    <circle cx="90" cy="198" r="3"/><circle cx="101" cy="204" r="3"/><circle cx="112" cy="194" r="3"/>
  </g>

  <rect x="278" y="181" width="190" height="91" class="box shared"/>
  <text x="373" y="211" class="blockTitle">Center XYZ</text>
  <text x="373" y="239" class="blockText">per frame</text>
  <text x="373" y="263" class="tiny">preserve metric scale</text>

  <rect x="502" y="171" width="244" height="111" class="box shared"/>
  <text x="624" y="204" class="blockTitle">Shared point MLP</text>
  <text x="624" y="233" class="blockText">3 → 64 → 128</text>
  <text x="624" y="258" class="blockText">→ 256 → 512</text>
  <text x="624" y="279" class="tiny">1×1 Conv + BN + ReLU</text>

  <rect x="780" y="181" width="176" height="91" class="box global"/>
  <text x="868" y="211" class="blockTitle">Point max</text>
  <text x="868" y="239" class="blockText">over N points</text>
  <text x="868" y="263" class="tiny">B × T × 512</text>

  <rect x="990" y="181" width="176" height="91" class="box global"/>
  <text x="1078" y="211" class="blockTitle">Temporal max</text>
  <text x="1078" y="239" class="blockText">over T frames</text>
  <text x="1078" y="263" class="tiny">B × 512</text>

  <rect x="1200" y="171" width="210" height="111" class="box global"/>
  <text x="1305" y="204" class="blockTitle">Embedding head</text>
  <text x="1305" y="233" class="blockText">Linear 512 → 256</text>
  <text x="1305" y="258" class="blockText">BN + ReLU</text>
  <text x="1305" y="279" class="tiny">raw embedding</text>

  <rect x="1444" y="181" width="142" height="91" class="box output"/>
  <text x="1515" y="213" class="blockTitle">BNNeck</text>
  <text x="1515" y="241" class="blockText">256-D</text>
  <text x="1515" y="263" class="tiny">L2 normalize</text>

  <rect x="1620" y="165" width="112" height="62" class="box train"/>
  <text x="1676" y="192" class="blockTitle">CE head</text>
  <text x="1676" y="216" class="tiny">training</text>
  <rect x="1620" y="245" width="112" height="62" class="box output"/>
  <text x="1676" y="272" class="blockTitle">Cosine</text>
  <text x="1676" y="296" class="tiny">retrieval</text>

  <path d="M244 226 H278" class="arrow"/>
  <path d="M468 226 H502" class="arrow"/>
  <path d="M746 226 H780" class="arrow"/>
  <path d="M956 226 H990" class="arrowBlue"/>
  <path d="M1166 226 H1200" class="arrowBlue"/>
  <path d="M1410 226 H1444" class="arrowBlue"/>
  <path d="M1586 226 H1602 V196 H1620" class="arrow"/>
  <path d="M1602 226 V276 H1620" class="arrowGreen"/>
  <text x="900" y="342" class="panelMeta" text-anchor="middle">No explicit local hierarchy and no frame-order modeling</text>

  <!-- Panel B: proposed model -->
  <rect x="40" y="418" width="1720" height="604" class="panel"/>
  <text x="68" y="458" class="panelTitle">(b) MPH-Gait: Multi-scale Point-Hierarchy Gait Network</text>
  <text x="1728" y="458" class="panelMeta" text-anchor="end">405,954 parameters · +29.4% over baseline</text>

  <rect x="70" y="610" width="174" height="91" class="box input"/>
  <text x="157" y="642" class="blockTitle">Point sequence</text>
  <text x="157" y="670" class="blockText">B × T × N × 3</text>
  <text x="157" y="692" class="tiny">metric XYZ</text>

  <rect x="278" y="610" width="190" height="91" class="box shared"/>
  <text x="373" y="640" class="blockTitle">Center XYZ</text>
  <text x="373" y="668" class="blockText">per frame</text>
  <text x="373" y="692" class="tiny">scale preserved</text>

  <rect x="502" y="600" width="244" height="111" class="box shared"/>
  <text x="624" y="633" class="blockTitle">Shared PointNet stem</text>
  <text x="624" y="662" class="blockText">3 → 64 → 128</text>
  <text x="624" y="687" class="blockText">→ 256 → 512</text>
  <text x="624" y="708" class="tiny">point features: B·T × N × 512</text>

  <!-- Global path -->
  <text x="787" y="506" class="panelMeta" fill="#1d4ed8">GLOBAL IDENTITY PATH</text>
  <rect x="780" y="526" width="184" height="91" class="box global"/>
  <text x="872" y="557" class="blockTitle">Point max</text>
  <text x="872" y="585" class="blockText">per frame</text>
  <text x="872" y="608" class="tiny">B × T × 512</text>

  <rect x="998" y="526" width="184" height="91" class="box global"/>
  <text x="1090" y="557" class="blockTitle">Temporal max</text>
  <text x="1090" y="585" class="blockText">over T</text>
  <text x="1090" y="608" class="tiny">B × 512</text>

  <rect x="1216" y="516" width="208" height="111" class="box global"/>
  <text x="1320" y="549" class="blockTitle">Global embedding</text>
  <text x="1320" y="578" class="blockText">Linear 512 → 256</text>
  <text x="1320" y="603" class="blockText">BN + ReLU</text>
  <text x="1320" y="624" class="tiny">z<tspan baseline-shift="sub" font-size="12">g</tspan></text>

  <!-- Local hierarchy path -->
  <text x="787" y="674" class="panelMeta" fill="#9a3412">LOCAL POINT-HIERARCHY RESIDUAL</text>
  <rect x="780" y="695" width="218" height="119" class="box hier"/>
  <text x="889" y="727" class="blockTitle">Regular 3D windows</text>
  <text x="889" y="756" class="blockText">Fine: 2×2×4 = 16</text>
  <text x="889" y="781" class="blockText">Coarse: 1×2×2 = 4</text>
  <text x="889" y="806" class="tiny">min–max XYZ for routing only</text>

  <rect x="1032" y="686" width="230" height="137" class="box hier"/>
  <text x="1147" y="718" class="blockTitle">Window tokenizer</text>
  <text x="1147" y="747" class="blockText">content + position</text>
  <text x="1147" y="772" class="blockText">weighted point pooling</text>
  <text x="1147" y="797" class="blockText">+ geometry metadata</text>
  <text x="1147" y="819" class="tiny">20 × 64-D tokens / frame</text>

  <rect x="1296" y="686" width="236" height="137" class="box hier"/>
  <text x="1414" y="718" class="blockTitle">Within-frame mixer</text>
  <text x="1414" y="747" class="blockText">Transformer: 1 layer</text>
  <text x="1414" y="772" class="blockText">4 heads, MLP ratio 2</text>
  <text x="1414" y="797" class="blockText">masked mean + max</text>
  <text x="1414" y="819" class="tiny">local frame feature: 64-D</text>

  <rect x="1296" y="858" width="236" height="106" class="box hier"/>
  <text x="1414" y="890" class="blockTitle">Local sequence</text>
  <text x="1414" y="919" class="blockText">Temporal max</text>
  <text x="1414" y="944" class="blockText">Linear + LayerNorm → 256</text>

  <rect x="1562" y="800" width="166" height="114" class="box fusion"/>
  <text x="1645" y="833" class="blockTitle">Residual</text>
  <text x="1645" y="860" class="blockText">L2 direction</text>
  <text x="1645" y="884" class="blockText">norm-matched to z<tspan baseline-shift="sub" font-size="12">g</tspan></text>
  <text x="1645" y="908" class="tiny">δ<tspan baseline-shift="sub" font-size="11">h</tspan></text>

  <!-- Fusion and output -->
  <rect x="1490" y="516" width="178" height="111" class="box fusion"/>
  <text x="1579" y="548" class="blockTitle">Bounded fusion</text>
  <text x="1579" y="580" class="formula">z = z<tspan baseline-shift="sub" font-size="13">g</tspan> + wδ<tspan baseline-shift="sub" font-size="13">h</tspan></text>
  <text x="1579" y="609" class="blockText">w = 0.20 tanh(α)</text>

  <rect x="1692" y="516" width="48" height="111" class="box output"/>
  <text x="1716" y="548" class="blockTitle">BN</text>
  <text x="1716" y="578" class="blockText">Neck</text>
  <text x="1716" y="607" class="tiny">256-D</text>

  <rect x="1562" y="944" width="166" height="49" class="box output"/>
  <text x="1645" y="975" class="blockTitle">Cosine retrieval</text>

  <!-- Arrows and branches -->
  <path d="M244 655 H278" class="arrow"/>
  <path d="M468 655 H502" class="arrow"/>
  <path d="M746 655 H760 V571 H780" class="arrowBlue"/>
  <circle cx="760" cy="655" r="5" class="branchDot"/>
  <path d="M760 655 V754 H780" class="arrowOrange"/>
  <path d="M964 571 H998" class="arrowBlue"/>
  <path d="M1182 571 H1216" class="arrowBlue"/>
  <path d="M1424 571 H1490" class="arrowBlue"/>
  <path d="M998 754 H1032" class="arrowOrange"/>
  <path d="M1262 754 H1296" class="arrowOrange"/>
  <path d="M1414 823 V858" class="arrowOrange"/>
  <path d="M1532 911 H1548 V857 H1562" class="arrowOrange"/>
  <path d="M1645 800 V661 H1579 V627" class="arrowGreen"/>
  <path d="M1668 571 H1692" class="arrowGreen"/>
  <path d="M1716 627 V928 H1645 V944" class="arrowGreen"/>
  <path d="M468 700 V844 H889 V814" class="routing"/>
  <text x="612" y="838" class="note">dashed: routing coordinates only</text>

  <!-- Legend -->
  <rect x="70" y="943" width="22" height="22" class="box shared"/>
  <text x="104" y="961" class="blockText" text-anchor="start">shared PointNet</text>
  <rect x="260" y="943" width="22" height="22" class="box global"/>
  <text x="294" y="961" class="blockText" text-anchor="start">global path</text>
  <rect x="420" y="943" width="22" height="22" class="box hier"/>
  <text x="454" y="961" class="blockText" text-anchor="start">MPH local branch</text>
  <rect x="650" y="943" width="22" height="22" class="box fusion"/>
  <text x="684" y="961" class="blockText" text-anchor="start">bounded correction</text>
  <text x="70" y="997" class="panelMeta">Temporal aggregation remains max pooling; self-attention is restricted to the 20 hierarchy tokens within each frame.</text>
</svg>
