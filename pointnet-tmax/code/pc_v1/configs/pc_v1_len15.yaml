data:
  root: ../../dataset/local/pointcloud
  dataset_name: PersonRecognitionWalking_29
  modality: pointcloud
  coordinate_adapter: kinect_xyz_mm_to_forward_lateral_height_m_v1
  num_points: 1024
  clip_len: 15
  drop_first_frames: 30
  random_point_sample_train: true
  pad_short: true
  train_split: train
  val_split: testA_probe
  batch_size: 16
  num_workers: 4
  loader_seed: 0
  train_filters:
    clothes_ids:
    - 2
    - 3
    condition_tags:
    - normal
  val_filters:
    clothes_ids:
    - 1
model:
  name: pointnet_tmax
  num_classes: 29
  in_channels: 3
  point_channels:
  - 64
  - 128
  - 256
  - 512
  embedding_dim: 256
  temporal_pool: max
  dropout: 0.0
  point_normalization: center
loss:
  ce_scale: 1.0
train:
  epochs: 50
  device: auto
  amp: false
  deterministic: true
  cudnn_benchmark: false
  log_interval: 20
  save_every: 10
  retrieval_eval_every: 1
  selection_metric: val_retrieval_mAP
  selection_pair: val
  best_tie_break: none
  grad_clip_norm: 1.0
  nonfinite_policy: raise
  max_nonfinite_batches: 0
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.01
scheduler:
  name: cosine
retrieval:
  metric: cosine
  ranks:
  - 1
  - 5
  normalize_embeddings: true
  uniform_gallery_splits: &id001
  - val_gallery
  - val_probe
  - gallery
  personal_splits: &id003
  - testA_probe
  special_splits: &id007
  - testB_probe
  uniform_filters: &id002
    clothes_ids:
    - 2
    - 3
    condition_tags:
    - normal
  c2_filters: &id005
    clothes_ids:
    - 2
    condition_tags:
    - normal
  c3_filters: &id006
    clothes_ids:
    - 3
    condition_tags:
    - normal
  c1_filters: &id004
    clothes_ids:
    - 1
  special_filters: &id008
    clothes_ids:
    - 4
    - 5
    - 7
  c4c5_normal_filters: &id009
    clothes_ids:
    - 4
    - 5
    condition_tags:
    - normal
  c7_filters: &id010
    clothes_ids:
    - 7
  all_query_filters: &id011
    clothes_ids:
    - 1
    - 4
    - 5
    - 7
  pairs:
    val:
      gallery_splits: *id001
      gallery_filters: *id002
      probe_splits: *id003
      probe_filters: *id004
      gallery_id_source: val_ids
      probe_id_source: val_ids
    val_c2_to_c3:
      gallery_splits: *id001
      gallery_filters: *id005
      probe_splits: *id001
      probe_filters: *id006
