  name: pointnet_tmax_len15_fixed_special5
  seed: 0
method:
  family: pointnet_tmax
  id: pointnet_tmax
  role: lightweight_pointcloud_baseline
  implementation: pc_v1.model.TemporalPointNetV1
  research_target: same_view_special_clothing
protocol:
  enabled: true
  name: fixed_special5_subject_holdout_5split_v1
  version: fixed_special5_subject_holdout_5split_v1_20260724
  split_index: 0
  val_group_offset: 1
  fixed_special_test_ids:
  - 3
  - 7
  - 18
  - 19
  - 26
  development_groups:
  - - 1
    - 5
    - 9
    - 11
    - 20
  - - 12
    - 17
    - 21
    - 22
    - 25
  - - 2
    - 10
    - 14
    - 24
    - 27
  - - 4
    - 8
